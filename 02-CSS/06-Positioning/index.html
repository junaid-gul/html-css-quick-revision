<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Postion</title>
    <style>
        body{
            /* width: 100vw;*/
             height: 100vh; 
            background-color: antiquewhite;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .product-card{
            width: 300px;
            background-color: rgb(171, 148, 118);
            color: white;
            padding: 20px 20px;
            border-radius: 20px;
            border: 1px solid var(#120312);
            display: flex;
            flex-direction: column;
           
            position: relative;

        }
        .product-image{
            background-color: rgb(36, 36, 36);
            height: 200px;
            color: rgb(36, 36, 36);
            border-radius: 10px;
        }
        .badge{
            color: red;
            font-size: 10px;
            position: absolute;
            top: 25px;
            right: 25px;
        }
    </style>
  </head>
  <body>
    <div class="product-card">
      <span class="badge">NEW</span>

      <div class="product-image">IMAGE</div>
      <h2>Wireless Headphones</h2>
      <p>$49</p>
    </div>
  </body>
</html>
