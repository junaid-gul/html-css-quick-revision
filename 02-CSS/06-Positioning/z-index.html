
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>z-index Practice</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
      }

      .container {
        position: relative;
        width: 500px;
        height: 400px;
      }

      .box {
        position: absolute;
        width: 200px;
        height: 200px;
        border-radius: 20px;
      }

      .box-one {
        top: 40px;
        left: 40px;
        background-color: blue;
      }

      .box-two {
        top: 100px;
        left: 150px;
        background-color: green;
      }

      .box-three {
        top: 160px;
        left: 250px;
        background-color: red;
        z-index: -1;
      }
    </style>
  </head>

  <body>

    <div class="container">
      <div class="box box-one"></div>
      <div class="box box-two"></div>
      <div class="box box-three"></div>
    </div>

  </body>
</html>
