
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky Navbar Practice</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
      }

      /* Navbar */
      .navbar {
        height: 70px;
        padding: 0 40px;
        background-color: #222;
        color: white;
        position: sticky;
        top: 0;
      }

      .navbar-content {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .logo {
        font-size: 22px;
        font-weight: bold;
      }

      .nav-links {
        display: flex;
        gap: 25px;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .nav-links a {
        color: white;
        text-decoration: none;
      }

      /* Main */
      main {
        padding: 40px;
      }

      .box {
        width: 100%;
        height: 300px;
        margin-bottom: 30px;
        background-color: #d8c3a5;
        border-radius: 15px;
      }

      /* Footer */
      footer {
        height: 100px;
        display: grid;
        place-items: center;
        background-color: #222;
        color: white;
      }
    </style>
  </head>

  <body>

    <nav class="navbar">
      <div class="navbar-content">
        <div class="logo">NavBar</div>

        <ul class="nav-links">
          <li><a href="#">Home</a></li>
          <li><a href="#">Projects</a></li>
          <li><a href="#">About</a></li>
        </ul>
      </div>
    </nav>

    <main>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
    </main>

    <footer>
      Footer
    </footer>

  </body>
</html>
