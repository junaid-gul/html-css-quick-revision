<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>
    <style>
      .profile-card {
        width: 350px;
        background-color: white;
        padding: 20px;
       border: 1px solid #ddd;
        border-radius: 12px;
        margin: 0 auto;
        text-align: center;
      }
      .profile-name {
        font-size: 24px;
        font-weight: bold;
        color: #333;
        margin-bottom: 0;
        margin-bottom: 20px;
      }
      .profile-role{
        font-size: 20px;
        font-weight: 900;
        color: blue;
        margin-bottom: 20px;
        
      }
      .profile-card .profile-role{
        color: green;
      }
      .profile-bio{
        font-size: 18px;
        line-height: 20px;
        color: rgb(35, 34, 33);
           margin-bottom: 20px;
    
      }
      .profile-button{
        background-color: red;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 20px;
           margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="profile-card">
      <h1 class="profile-name">Junaid Gul</h1>
      <h2 class="profile-role">Role: Frontend Developer</h2>
      <p class="profile-bio">
        Bio: Learning frontend development and building projects with HTML, CSS
        and JavaScript.
      </p>
      <button class="profile-button">View Profile</button>
    </div>
  </body>
</html>
