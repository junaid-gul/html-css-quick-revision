<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Price Product Page</title>
  </head>

  <style>
    .pricing{
        height: 100vh;
        background-color: rgb(123, 96, 63);
        padding: 20px;
        display: flex;
        column-gap: 10px;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        
    }

    .pricing-card{
        background-color: rgb(66, 87, 177);
        width: 300px;
        height: 200px;
        border: 1px solid rgb(44, 42, 42);
        border-radius: 12px;
        border-color: brown;
        color: white;
       text-align: center;
        
    }

    button {
        padding: 10px 20px;
        border-radius: 20px;
        border: none;
        background-color: red;
    }


  </style>
  <body>


    <section class="pricing">
      <div class="pricing-card">
        <h3>Basic</h3>
        <p class="price">$10</p>
        <p>For personal projects</p>
        <button>Choose Plan</button>
      </div>

      <div class="pricing-card">
        <h3>Pro</h3>
        <p class="price">$20</p>
        <p>For growing projects</p>
        <button>Choose Plan</button>
      </div>

      <div class="pricing-card">
        <h3>Premium</h3>
        <p class="price">$30</p>
        <p>For larger projects</p>
        <button>Choose Plan</button>
      </div>
    </section>



  </body>
</html>
