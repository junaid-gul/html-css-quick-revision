<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Typography Practice</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color: #1f2937;
    }

    h1 {
      font-size: 36px;
      font-weight: 700;
      line-height: 1.2;
    }

    h2 {
      font-size: 28px;
      font-weight: 600;
    }

    h3 {
      font-size: 20px;
      font-weight: 600;
    }

    p {
      font-size: 16px;
      font-weight: 400;
      line-height: 1.6;
    }

    .subtitle {
      font-size: 18px;
      color: #6b7280;
    }

    .label {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
  </style>
</head>

<body>

  <h1>Frontend Development</h1>

  <p class="subtitle">Learning HTML, CSS and JavaScript</p>

  <h2>My Learning Journey</h2>

  <p>
    I am practicing frontend development and improving my understanding
    of modern web design.
  </p>

  <h3>Current Focus</h3>

  <p class="label">CSS Typography</p>

  <p>
    Good typography creates clear visual hierarchy and makes content
    easier to read.
  </p>

</body>
</html>
