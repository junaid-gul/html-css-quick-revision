<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pseudo-elements Practice</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <style>
    * {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background-color: #f4f4f4;
}

.container {
  min-height: 100vh;
  display: grid;
  place-items: center;
}

.card {
  width: 500px;
  padding: 40px;
  background-color: white;
  border-radius: 12px;
  text-align: center;
}

.title {
  margin-top: 0;
  font-size: 32px;
}

.description {
  line-height: 1.6;
  color: #555;
}

.btn {
  padding: 12px 24px;
  border: none;
  border-radius: 6px;
  background-color: #222;
  color: white;
  cursor: pointer;
}




/* 1. ::before
   Add something before the title
*/
.title::before{
    content: "-> ";
}


/* 2. ::after
   Add something after the title
*/
.title::after{
    content: " .";
}

p::first-letter{
    font-size: 20px;
    color: red;
}

/* 3. ::first-letter
   Make the first letter of the paragraph
   larger and different
*/


/* 4. ::selection
   Change the appearance of selected text
*/
p::selection{
    background-color: #555;
    color: white;
}


  </style>

  <body>

    <main class="container">

      <section class="card">

        <h1 class="title">Frontend Development</h1>

        <p class="description">
          Learning frontend development is about understanding how websites
          are structured, styled, and made interactive.
        </p>

        <button class="btn">Start Learning</button>

      </section>

    </main>

  </body>
</html>
